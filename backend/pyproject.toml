[project]
name = "fleet-battery-api"
version = "0.1.0"
description = "API and data model for the battery health PoC of an Android fleet"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3",
    "pydantic>=2",
    "pydantic-settings>=2",
    "httpx",
    "joblib==1.6.0",
    "numpy==2.5.3",
    "pandas==3.0.6",
    "scikit-learn==1.9.1",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "bandit",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N"]

[tool.pytest.ini_options]
testpaths = ["tests"]
