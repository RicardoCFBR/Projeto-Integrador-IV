# Prova de conceito BatteryCare - somente dados sinteticos e plano gratuito.
# Conecte como Render Blueprint apos incorporar esta configuracao a main.
services:
  - type: web
    name: batterycare-api-pi4
    runtime: python
    plan: free
    branch: main
    region: virginia
    buildCommand: pip install -e ./backend
    startCommand: cd backend && python -m app.render_bootstrap && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.5
      - key: WEB_CONCURRENCY
        value: "1"
      - key: READ_ONLY_DEMO
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: batterycare-postgres-pi4
          property: connectionString
      - key: FRONTEND_ORIGINS
        fromService:
          name: batterycare-web-pi4
          type: web
          envVarKey: RENDER_EXTERNAL_URL

  - type: web
    name: batterycare-web-pi4
    runtime: static
    branch: main
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: NODE_VERSION
        value: 22.14.0
      - key: VITE_API_URL
        fromService:
          name: batterycare-api-pi4
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: VITE_USE_MOCKS
        value: "false"
      - key: VITE_READ_ONLY_DEMO
        value: "true"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: batterycare-postgres-pi4
    plan: free
    region: oregon
    postgresMajorVersion: "16"
    databaseName: batterycare_postgres_pi4
    user: batterycare_postgres_pi4_user
